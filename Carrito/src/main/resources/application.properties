server.port=8085
spring.application.name=Carrito

# Conexión a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/carrito_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.carrito.sql

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
